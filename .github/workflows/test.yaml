name: Full database smoke (manual)
# Downloads the legacy scientific database and solves rule-level environments.
# Keep this expensive test opt-in; portability CI does not claim science parity.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vs2-controller
          environment-file: vs2-external-deps.yaml
          auto-activate-base: false
      - run: python -m pip install -e .
      - run: virsorter setup -d db -j 4
      - run: virsorter run -w test/test.out -i test/8seq.fa --db-dir db -j 4 all
